name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # numpy is the project's only runtime dependency; pytest is test-only.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      # These tests are deliberately data-free. KuaiRand-Pure is ~1 GB, is not
      # committed, and its download hosts are unreachable from CI - so the
      # suite covers the search policy, the pre-execution checks and the
      # submission contract, and leaves the end-to-end run to harness_check.py.
      - name: Run tests
        run: python -m pytest tests/ -v
