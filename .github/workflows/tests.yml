name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # numpy is the project's only runtime dependency; pytest is test-only.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      # These tests are deliberately data-free. KuaiRand-Pure is ~1 GB, is not
      # committed, and its download hosts are unreachable from CI - so the
      # KuaiRand-specific end-to-end run stays in harness_check.py, which needs
      # the dataset and is run locally.
      #
      # Everything else now runs here. tasks/synthetic generates its own data
      # in under a second and the loop tests stub the model, so CI exercises
      # the full draft/improve/debug state machine, convergence, the journal
      # and the noise-floor calibration - none of which had automated coverage
      # before, despite being where every production failure actually happened.
      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Whole loop, end to end, on the synthetic task
        run: python -m pytest tests/test_loop_end_to_end.py tests/test_calibration.py -v
